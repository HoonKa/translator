<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Live Captions</title>
<script src="config.js"></script>
<style>
  :root { --bg:#0f1115; --text:#f1f3f7; --dim:#8b93a3; --bar:#181b22; --line:#2a2f3a; --fs:24px; }
  body.light { --bg:#ffffff; --text:#111; --dim:#6b7280; --bar:#f3f4f6; --line:#e5e7eb; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display:flex; flex-direction:column; }
  .bar { display:flex; align-items:center; gap:6px; padding:8px 10px; padding-top:max(8px, env(safe-area-inset-top)); background:var(--bar); border-bottom:1px solid var(--line); }
  .bar .code { font-weight:700; letter-spacing:2px; font-size:14px; color:var(--dim); }
  .dot { width:9px; height:9px; border-radius:50%; background:#666; flex:none; }
  .dot.ok { background:#2ecc71; } .dot.warn { background:#f5a623; }
  .spacer { flex:1; }
  select, button { font:inherit; font-size:15px; background:transparent; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 8px; flex:none; }
  select { flex:0 1 auto; min-width:0; max-width:42vw; }
  select option { color:#111; }
  #feed { flex:1; overflow-y:auto; padding:16px 16px 40vh; font-size:var(--fs); line-height:1.45; -webkit-overflow-scrolling:touch; }
  #feed p { margin:0 0 .55em; }
  #feed p.old { color:var(--dim); }
  #feed .partial { color:var(--text); opacity:.75; }
  #status { text-align:center; color:var(--dim); padding:30px 10px; font-size:18px; }
  #jump { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:none; background:#4f8cff; color:white; border:none; border-radius:999px; padding:10px 18px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
</style>
</head>
<body>
  <div class="bar">
    <span class="dot" id="dot"></span>
    <span class="code" id="code"></span>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language"></select>
    <button id="smaller" aria-label="Smaller text">A−</button>
    <button id="bigger" aria-label="Bigger text">A+</button>
    <button id="theme" aria-label="Light or dark">◐</button>
  </div>
  <div id="feed"><div id="status">Connecting…</div></div>
  <button id="jump">↓ Latest</button>
<script type="module" src="js/student.js"></script>
</body>
</html>
